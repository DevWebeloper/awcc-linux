<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#3584e4"/>
      <stop offset="80%" stop-color="#7852ff"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bfbf5"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>

    <!-- Turbo Orange Glow -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle Inner Ring Dial -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="24"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGlow)" stroke-width="8" stroke-dasharray="32 16" stroke-dashoffset="12" opacity="0.6"/>

  <!-- Turbo Outer Arc -->
  <path d="M 143 369 A 160 160 0 1 1 369 369" fill="none" stroke="url(#borderGrad)" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Speedometer / Power Dial Ticks -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="106" x2="256" y2="124"/>
    <line x1="150" y1="150" x2="163" y2="163"/>
    <line x1="362" y1="150" x2="349" y2="163"/>
    <line x1="106" y1="256" x2="124" y2="256"/>
    <line x1="406" y1="256" x2="388" y2="256"/>
  </g>

  <!-- Alienware Icon Silhouette in Center -->
  <g transform="translate(196, 176) scale(0.24)" filter="url(#neonGlow)">
    <!-- Alien Head Outline -->
    <path d="M250 20 C140 20 50 110 50 220 C50 360 170 480 250 495 C330 480 450 360 450 220 C450 110 360 20 250 20 Z" fill="#0c1424" stroke="url(#cyanGlow)" stroke-width="26"/>
    <!-- Left Eye -->
    <path d="M120 200 C150 230 190 270 210 320 C170 320 120 280 110 220 Z" fill="url(#cyanGlow)"/>
    <!-- Right Eye -->
    <path d="M380 200 C350 230 310 270 290 320 C330 320 380 280 390 220 Z" fill="url(#cyanGlow)"/>
  </g>

  <!-- Center Status / Speed Needle Hub -->
  <circle cx="256" cy="380" r="14" fill="url(#cyanGlow)"/>
  <circle cx="256" cy="380" r="6" fill="#ffffff"/>

  <!-- Turbo Flame Accent -->
  <path d="M 256 320 Q 268 340 262 355 Q 274 345 270 330 Q 282 350 278 368 C 274 374 266 380 256 380 C 246 380 238 374 234 368 Q 230 350 242 330 Q 238 345 250 355 Q 244 340 256 320 Z" fill="url(#orangeGlow)" opacity="0.9"/>
</svg>
